[project]
name = "user-service"
version = "1.0.0"
description = "CoGo user accounts and profiles."
requires-python = ">=3.13"
dependencies = [
    "cogo-common[db,events,telemetry]",
    "alembic>=1.17",
    "uvicorn[standard]>=0.38",
    "boto3>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "asgi-lifespan>=2.1",
    "testcontainers[postgres,rabbitmq,minio]>=4.13",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
package = false

[tool.uv.sources]
cogo-common = { path = "../../libs/common" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]  # SQL strings
"tests/*" = ["S105", "S106", "S311", "S603", "S607", "E501", "ASYNC109", "ASYNC210", "S110"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

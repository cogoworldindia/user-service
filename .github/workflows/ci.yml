name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

env:
  # cogo-common is consumed from a sibling checkout (same layout as the cogo-backend repo).
  COMMON_REF: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: services/user
      - uses: actions/checkout@v4
        with:
          repository: cogoworldindia/cogo-common
          ref: ${{ env.COMMON_REF }}
          path: libs/common
          token: ${{ secrets.COGO_COMMON_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - working-directory: services/user
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest -q
      - name: Build image
        run: docker build --build-context common=libs/common -t user-service:ci services/user
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: user-service:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
